services:
    db:
        build: .
        restart: always
        environment:
            MONGO_INITDB_DATABASE: "cooking"
            MONGO_INITDB_ROOT_USERNAME: "cooking"
            MONGO_INITDB_ROOT_PASSWORD: "cooking"
        ports:
            - "27018:27017"
        volumes:
            - mongo-data:/data/db

volumes:
    mongo-data:
